<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Clone — เพลงและพอดแคสต์</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ═══════════ SIDEBAR ═══════════ -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24" width="32" height="32" fill="#1db954">
        <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.56-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.3 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
      </svg>
      <span>Spotify</span>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-btn active" data-view="home">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 3l10 8h-3v10h-5v-6h-4v6H5V11H2l10-8z"/></svg>
        <span>บ้าน</span>
      </button>
      <button class="nav-btn" data-view="search">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        <span>ค้นหา</span>
      </button>
      <button class="nav-btn" data-view="library">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2.9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
        <span>อัลบั้มของคุณ</span>
      </button>
    </nav>

    <div class="sidebar-playlists">
      <h3>เพลย์ลิสต์</h3>
      <ul id="playlist-list"></ul>
    </div>
  </aside>

  <!-- ═══════════ MAIN CONTENT ═══════════ -->
  <main class="main-content">
    <header class="top-bar">
      <div class="top-bar-left">
        <button class="circle-btn" id="prev-view">‹</button>
        <button class="circle-btn" id="next-view">›</button>
      </div>
      <div class="search-box" id="search-box" style="display:none;">
        <input type="text" id="search-input" placeholder="ค้นหาเพลง นักร้อง หรืออัลบั้ม..." />
      </div>
      <div class="top-bar-right">
        <span class="user-avatar">👤</span>
      </div>
    </header>

    <div class="content-area" id="content-area">
      <!-- Render by JS -->
    </div>
  </main>

  <!-- ═══════════ PLAYER BAR ═══════════ -->
  <footer class="player-bar">
    <div class="player-left">
      <canvas id="player-art" width="56" height="56"></canvas>
      <div class="player-info">
        <div class="player-title" id="player-title">—</div>
        <div class="player-artist" id="player-artist">—</div>
      </div>
      <button class="player-like" id="player-like">♡</button>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button class="ctrl-btn" id="btn-shuffle" title="Shuffle">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-prev">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn ctrl-play" id="btn-play">
          <svg viewBox="0 0 24 24" width="28" height="28" id="icon-play"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
          <svg viewBox="0 0 24 24" width="28" height="28" id="icon-pause" style="display:none;"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-next">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-repeat" title="Repeat">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>
      </div>
      <div class="progress-wrap">
        <span class="time" id="time-current">0:00</span>
        <div class="progress-bar" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
          <div class="progress-thumb" id="progress-thumb"></div>
        </div>
        <span class="time" id="time-total">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <button class="ctrl-btn" id="btn-volume-icon">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </button>
      <div class="volume-bar" id="volume-bar">
        <div class="volume-fill" id="volume-fill" style="width:70%"></div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/player.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
